name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]" --no-build-isolation
      - run: pytest -q
      - run: python run_suite.py --config configs/outgoing_z2.yaml --report report.json
